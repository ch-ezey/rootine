spring.application.name=rootine-api

# Profiles: "dev" for local work, "prod" for deployments (set SPRING_PROFILES_ACTIVE=prod)
spring.profiles.default=dev

# Load local secrets from rootine-api/.env when present (never committed; see .env.example)
spring.config.import=optional:file:.env[.properties]

# Database Configuration
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rootine}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# JPA Configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server Configuration
server.port=${PORT:8080}

# Security Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# OpenAI
openai.api.key=${OPENAI_API_KEY}
