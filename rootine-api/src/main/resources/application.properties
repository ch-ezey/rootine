spring.application.name=rootine-api

# Profiles: "dev" for local work, "prod" for deployments (set SPRING_PROFILES_ACTIVE=prod)
spring.profiles.default=dev

# Load local secrets from rootine-api/.env when present (never committed; see .env.example)
spring.config.import=optional:file:.env[.properties]

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/rootine}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate

# Server Configuration
server.port=${PORT:8080}

# Security Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# OpenAI
openai.api.key=${OPENAI_API_KEY}
